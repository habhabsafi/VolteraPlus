<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Service | Voltera Plus</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="images/logo-mark.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="services">
<div id="site-header"></div>
<section class="page-hero"><div class="container"><h1 id="sd-title">Service</h1><p id="sd-short"></p></div></section>

<main id="service-detail">
<section class="section"><div class="container">
  <img id="sd-img" src="" alt="" style="border-radius:16px;width:100%;aspect-ratio:16/8;object-fit:cover">
</div></section>

<section class="section" style="padding-top:0"><div class="container grid" style="grid-template-columns:1.5fr 1fr;align-items:start">
  <div>
    <h2 id="sd-why"></h2>
    <p id="sd-text" style="margin:14px 0 28px"></p>
    <h3 style="margin-bottom:12px">Advantages of choosing Voltera Plus</h3>
    <ul class="checks" id="sd-perks" style="grid-template-columns:1fr"></ul>
  </div>
  <form class="form-card dark" id="sd-form" data-form>
    <h3 style="margin-bottom:18px">Request a Free Estimate</h3>
    <div class="field"><label>Full Name</label><input name="Name" data-req placeholder="Your full name"><span class="err">Please enter your name.</span></div>
    <div class="field"><label>Required Service</label><select name="Service" data-req data-render="svc-options"></select><span class="err">Please choose a service.</span></div>
    <div class="field"><label>Email Address</label><input name="Email" type="email" data-req placeholder="Type your mail address"><span class="err">Please enter a valid email.</span></div>
    <button class="btn btn-gold" type="submit">Get a Quote</button><div class="form-ok"></div>
  </form>
</div></section>

<section class="section" style="padding-top:0"><div class="container split" style="grid-template-columns:1fr 1.2fr">
  <div><h2>The Complete Electrical Service Hub</h2><p style="margin:12px 0 22px">Our crew ensures every detail is attended to.</p><div class="acc" id="sd-acc"></div></div>
  <div class="side-img"><img id="sd-hub-img" src="" alt=""></div>
</div></section>
</main>

<div id="cta"></div>
<div id="site-footer"></div>
<script src="js/main.js"></script>
</body>
</html>
